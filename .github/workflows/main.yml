name: Action to build and publish the project as a nuget package to github package registry

on:
  push:
    branches: 
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      Version: ${{ steps.gitversion.outputs.SemVer }}
      CommitsSinceVersionSource: ${{ steps.gitversion.outputs.CommitsSinceVersionSource }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v0.9.7
        with:
          versionSpec: 5.x

      - name: Determine Version
        uses: gittools/actions/gitversion/execute@v0.9.7
        id: gitversion

      - name: Display GitVersion outputs
        run: |
          echo "Version: ${{ steps.gitversion.outputs.SemVer }}"
          echo "CommitsSinceVersionSource: ${{ steps.gitversion.outputs.CommitsSinceVersionSource }}"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore
        working-directory: ./Seguridad/SeguridadMW.Middleware

      - name: Build
        run: dotnet build --no-restore
        working-directory: ./Seguridad/SeguridadMW.Middleware

      - name: Pack
        run: dotnet pack -p:Version='${{ steps.gitversion.outputs.SemVer }}' -c Release
        working-directory: ./Seguridad/SeguridadMW.Middleware
      
      - name: Upload NuGet package to GitHub
        uses: actions/upload-artifact@v3
        with:
          name: Autorizacion
          path: ./Seguridad/SeguridadMW.Middleware/bin/Release/*.nupkg
          if-no-files-found: error
          retention-days: 7

  release:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
  
    steps:
      - name: Checkout
        uses: actions/checkout@v3
    
      - name: Download Artifacts
        uses: actions/download-artifact@v3
        with:
          name: Autorizacion

      - name: List Files
        run: ls -R

      - name: Prep packages
        run: dotnet nuget add source --username Nicolas084505 --password ${{ secrets.PAQUETES_TOKEN }} --store-password-in-clear-text --name pac https://nuget.pkg.github.com/Nicolas084505/index.json
  
      - name: Push package to GitHub packages
        if: needs.build.outputs.CommitsSinceVersionSource > 0
        run: dotnet nuget push Autorizacion/*.nupkg --api-key ${{ secrets.PAQUETES_TOKEN }} --source "pac"
  
      - name: Create Release
        if: needs.build.outputs.CommitsSinceVersionSource > 0
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.build.outputs.Version }}
          name: Release ${{ needs.build.outputs.Version }}
          artifacts: "Autorizacion/*"
          token: ${{ secrets.PAQUETES_TOKEN }}
